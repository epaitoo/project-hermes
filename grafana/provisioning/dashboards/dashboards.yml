apiVersion: 1

providers:
  - name: Hermes
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      # Directory of committed dashboard JSON, bind-mounted read-only.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
