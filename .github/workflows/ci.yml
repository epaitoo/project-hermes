name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'asset/**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run:  go test -race ./...
  
  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/epaitoo/project-hermes:${{ github.sha }}
            ghcr.io/epaitoo/project-hermes:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Pin broker image to this commit
        run: |
          sed -i "s|image: ghcr.io/epaitoo/project-hermes:.*|image: ghcr.io/epaitoo/project-hermes:${{ github.sha }}|" k8s/broker-statefulset.yaml
      
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Manifest already current, nothing to commit."
            exit 0
          fi
          git add k8s/broker-statefulset.yaml
          git commit -m "ci: pin broker image to ${{ github.sha }}"
          git push

  